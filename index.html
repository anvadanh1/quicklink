<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Batch Downloader - Tải Video HD Không Watermark</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00f2ea;
            --secondary: #ff0050;
            --dark: #0a0a0a;
            --dark-2: #1a1a1a;
            --dark-3: #2a2a2a;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --success: #00ff88;
            --error: #ff3366;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 242, 234, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 80, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            font-weight: 400;
        }

        .main-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .input-section {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text);
        }

        textarea {
            width: 100%;
            min-height: 200px;
            background: var(--dark-2);
            border: 2px solid var(--dark-3);
            border-radius: 16px;
            padding: 1.25rem;
            color: var(--text);
            font-family: 'Work Sans', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 242, 234, 0.1);
        }

        textarea::placeholder {
            color: var(--text-dim);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 200px;
            padding: 1.25rem 2rem;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #00c9c1 100%);
            color: var(--dark);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 242, 234, 0.3);
        }

        .btn-secondary {
            background: var(--dark-2);
            color: var(--text);
            border: 2px solid var(--dark-3);
        }

        .btn-secondary:hover {
            border-color: var(--text-dim);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .results {
            margin-top: 3rem;
            animation: fadeInUp 0.6s ease-out;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .results-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .download-all-btn {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--secondary) 0%, #cc0040 100%);
            color: var(--text);
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .download-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 80, 0.3);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .video-card {
            background: var(--dark-2);
            border: 1px solid var(--dark-3);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: scaleIn 0.4s ease-out both;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 30px rgba(0, 242, 234, 0.2);
        }

        .video-thumbnail {
            width: 100%;
            aspect-ratio: 9/16;
            object-fit: cover;
            background: var(--dark-3);
        }

        .video-info {
            padding: 1.25rem;
        }

        .video-title {
            font-weight: 600;
            margin-bottom: 0.75rem;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.4;
        }

        .video-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .video-author {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .download-btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--primary);
            color: var(--dark);
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #00c9c1;
            transform: scale(1.02);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-dim);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--dark-3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        .status-message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            animation: slideIn 0.3s ease-out;
        }

        .status-success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .status-error {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .footer {
            text-align: center;
            margin-top: 4rem;
            padding: 2rem;
            color: var(--text-dim);
            font-size: 0.9rem;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--secondary);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem 1rem;
            }

            .main-card {
                padding: 1.5rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                min-width: unset;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }

            .results-header {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>TikTok Downloader</h1>
            <p class="subtitle">Tải video TikTok HD không watermark - Hàng loạt</p>
        </header>

        <div class="main-card">
            <div class="input-section">
                <label for="urls">Nhập link TikTok (mỗi link một dòng):</label>
                <textarea 
                    id="urls" 
                    placeholder="https://www.tiktok.com/@username/video/1234567890&#10;https://vm.tiktok.com/ZMxxx&#10;https://www.tiktok.com/@username/video/0987654321"
                ></textarea>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="processVideos()">
                    <span>🚀 Tải Video</span>
                </button>
                <button class="btn btn-secondary" onclick="clearAll()">
                    <span>🗑️ Xóa Tất Cả</span>
                </button>
            </div>

            <div id="statusMessage"></div>
        </div>

        <div id="results"></div>

        <footer class="footer">
            <p>Made with ❤️ by Claude | <a href="https://github.com" target="_blank">Deploy on GitHub Pages</a></p>
            <p style="margin-top: 0.5rem; font-size: 0.85rem;">Công cụ miễn phí - Không lưu trữ dữ liệu</p>
        </footer>
    </div>

    <script>
        let videoResults = [];

        async function processVideos() {
            const textarea = document.getElementById('urls');
            const urls = textarea.value.trim().split('\n').filter(url => url.trim());
            
            if (urls.length === 0) {
                showStatus('Vui lòng nhập ít nhất một link TikTok!', 'error');
                return;
            }

            showStatus(`Đang xử lý ${urls.length} video...`, 'success');
            showLoading(true);
            
            videoResults = [];
            
            for (let i = 0; i < urls.length; i++) {
                try {
                    const url = urls[i].trim();
                    showStatus(`Đang tải video ${i + 1}/${urls.length}...`, 'success');
                    
                    const videoData = await downloadTikTok(url);
                    if (videoData) {
                        videoResults.push(videoData);
                    }
                } catch (error) {
                    console.error('Error processing video:', error);
                }
                
                // Delay giữa các requests để tránh rate limit
                if (i < urls.length - 1) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }
            
            showLoading(false);
            
            if (videoResults.length > 0) {
                displayResults();
                showStatus(`✅ Đã tải thành công ${videoResults.length}/${urls.length} video!`, 'success');
            } else {
                showStatus('❌ Không thể tải video. Vui lòng kiểm tra lại link!', 'error');
            }
        }

        async function downloadTikTok(url) {
            try {
                // Sử dụng API công khai - TikTok Downloader API
                const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.code === 0 && data.data) {
                    return {
                        url: url,
                        title: data.data.title || 'TikTok Video',
                        author: data.data.author?.nickname || data.data.author?.unique_id || 'Unknown',
                        thumbnail: data.data.cover || data.data.origin_cover,
                        downloadUrl: data.data.hdplay || data.data.play,
                        duration: data.data.duration,
                        createTime: data.data.create_time
                    };
                }
                
                return null;
            } catch (error) {
                console.error('Error downloading TikTok:', error);
                return null;
            }
        }

        function displayResults() {
            const resultsDiv = document.getElementById('results');
            
            if (videoResults.length === 0) {
                resultsDiv.innerHTML = '';
                return;
            }
            
            let html = `
                <div class="main-card">
                    <div class="results-header">
                        <h2 class="results-title">📹 Kết quả (${videoResults.length} video)</h2>
                        <button class="download-all-btn" onclick="downloadAll()">⬇️ Tải Tất Cả</button>
                    </div>
                    <div class="video-grid">
            `;
            
            videoResults.forEach((video, index) => {
                html += `
                    <div class="video-card" style="animation-delay: ${index * 0.1}s">
                        <img src="${video.thumbnail}" alt="${video.title}" class="video-thumbnail" loading="lazy">
                        <div class="video-info">
                            <h3 class="video-title">${video.title}</h3>
                            <div class="video-meta">
                                <span class="video-author">👤 ${video.author}</span>
                                ${video.duration ? `<span>⏱️ ${formatDuration(video.duration)}s</span>` : ''}
                            </div>
                            <button class="download-btn" onclick="downloadSingle('${video.downloadUrl}', '${sanitizeFilename(video.title)}')">
                                ⬇️ Tải Video HD
                            </button>
                        </div>
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
            
            resultsDiv.innerHTML = html;
        }

        function downloadSingle(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = `${filename}.mp4`;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function downloadAll() {
            showStatus('Đang tải tất cả video...', 'success');
            
            for (let i = 0; i < videoResults.length; i++) {
                const video = videoResults[i];
                downloadSingle(video.downloadUrl, sanitizeFilename(video.title));
                
                // Delay giữa các downloads
                if (i < videoResults.length - 1) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            }
            
            showStatus(`✅ Đã bắt đầu tải ${videoResults.length} video!`, 'success');
        }

        function sanitizeFilename(filename) {
            return filename
                .replace(/[^a-z0-9\s\-_]/gi, '')
                .replace(/\s+/g, '_')
                .substring(0, 100);
        }

        function formatDuration(seconds) {
            return Math.floor(seconds);
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = `<div class="status-message status-${type}">${message}</div>`;
            
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 5000);
        }

        function showLoading(show) {
            const resultsDiv = document.getElementById('results');
            
            if (show) {
                resultsDiv.innerHTML = `
                    <div class="main-card loading">
                        <div class="spinner"></div>
                        <p>Đang xử lý video...</p>
                    </div>
                `;
            } else {
                if (videoResults.length === 0) {
                    resultsDiv.innerHTML = '';
                }
            }
        }

        function clearAll() {
            document.getElementById('urls').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('statusMessage').innerHTML = '';
            videoResults = [];
            showStatus('✅ Đã xóa tất cả!', 'success');
        }
    </script>
</body>
</html>
